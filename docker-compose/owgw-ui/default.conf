server {
    listen       80;
    listen  [::]:80;

    # Disable emitting nginx version
    server_tokens off;

    return 301 https://$host$request_uri;
}

server {
    listen       443 ssl;
    listen       [::]:443 ssl;

    # Disable emitting nginx version
    server_tokens off;

    ssl_certificate     /etc/nginx/restapi-cert.pem;
    ssl_certificate_key /etc/nginx/restapi-key.pem;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
    }

    # Grafana proxy (must be outside other locations)
    location /grafana/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /grafana;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Resolve Grafana at request time so UI container can start even if Grafana is down.
        resolver 127.0.0.11 ipv6=off valid=30s;
        set $grafana_upstream http://grafana:3000;
        proxy_pass $grafana_upstream;
    }

    # redirect server error pages to the static page /50x.html
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
